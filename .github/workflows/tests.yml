name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Smoke-test the command line
        run: |
          python -m balancer list
          python -m balancer simulate --games 200 --workers 1
          python -m balancer ablate --seeds 50 --workers 1
